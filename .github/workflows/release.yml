name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string
jobs:
  build-publish-and-release-to-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      ARTIFACT_BUCKET: hf-marketplace-fulfillment-artifacts-222369475058-use1
    steps:
      - uses: actions/checkout@v5
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: app-source
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: app-source
      - run: npm test
        working-directory: app-source
      - uses: aws-actions/setup-sam@v2
      - name: SAM build
        run: sam build
        working-directory: app-source
      - name: Package Lambda zip
        working-directory: app-source/.aws-sam/build/FulfillmentFunction
        run: zip -r "$GITHUB_WORKSPACE/lambda.zip" .

      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" lambda.zip --clobber

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::222369475058:role/marketplace-fulfillment-artifact-publisher
          role-session-name: publish-marketplace-lambda
          aws-region: us-east-1

      - name: Upload versioned artifact to S3
        id: artifact
        run: bash scripts/publish-lambda-artifact.sh

      - name: Create infra-shared GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROD_DEPLOY_APP_ID }}
          private-key: ${{ secrets.PROD_DEPLOY_APP_PRIVATE_KEY }}
          repositories: infra-shared

      - name: Release to stage (infra-shared pin PR, FAST_STAGE deploy, merge)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION_ID: ${{ steps.artifact.outputs.version_id }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          gh api repos/hyperflowfinance/infra-shared/dispatches -f event_type=marketplace-fulfillment-stage-release \
            -f "client_payload[tag]=$RELEASE_TAG" -f "client_payload[version_id]=$VERSION_ID" \
            -f "client_payload[sha256]=$ARTIFACT_SHA256"
