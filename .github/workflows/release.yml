name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string
jobs:
  build-publish-and-request-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ARTIFACT_BUCKET: hf-marketplace-fulfillment-artifacts-222369475058-use1
    steps:
      - uses: actions/checkout@v5
      - uses: hyperflowfinance/infra-shared/.github/actions/validate-release-tag@main
        with:
          require_tag: 'true'
      - name: Verify selected source
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* && "$RELEASE_TAG" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The release tag must match the selected workflow ref"; exit 1
          fi
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: app-source
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: app-source
      - run: npm test
        working-directory: app-source
      - uses: aws-actions/setup-sam@v2
      - name: SAM build
        run: sam build
        working-directory: app-source
      - name: Package Lambda zip
        working-directory: app-source/.aws-sam/build/FulfillmentFunction
        run: zip -r "$GITHUB_WORKSPACE/lambda.zip" .

      - name: Upload zip to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" lambda.zip --clobber

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::222369475058:role/marketplace-fulfillment-artifact-publisher
          role-session-name: publish-marketplace-lambda
          aws-region: us-east-1

      - name: Upload versioned artifact to S3
        id: artifact
        run: bash scripts/publish-lambda-artifact.sh

      - name: Record verified automatic stage release
        uses: hyperflowfinance/infra-shared/.github/actions/stage-release@main
        with:
          artifact: >-
            {"artifact_bucket":"hf-marketplace-fulfillment-artifacts-222369475058-use1",
            "artifact_key":"${{ steps.artifact.outputs.key }}",
            "artifact_version_id":"${{ steps.artifact.outputs.version_id }}",
            "artifact_sha256":"${{ steps.artifact.outputs.sha256 }}"}
