name: Release

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: aws-actions/setup-sam@v2

      - name: SAM build
        run: sam build

      - name: Package Lambda zip
        working-directory: .aws-sam/build/FulfillmentFunction
        run: zip -r "$GITHUB_WORKSPACE/lambda.zip" .

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" lambda.zip
