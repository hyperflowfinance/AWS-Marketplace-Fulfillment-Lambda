name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      ticket_key:
        description: Jira/internal ticket key, for example DO-123
        required: false
        type: string
jobs:
  build-publish-and-open-infra-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      TICKET_TEXT: ${{ github.event_name == 'release' && github.event.release.body || inputs.ticket_key }}
      ARTIFACT_BUCKET: hf-marketplace-fulfillment-artifacts-222369475058-use1
    steps:
      - uses: actions/checkout@v5
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: app-source
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: app-source
      - run: npm test
        working-directory: app-source
      - uses: aws-actions/setup-sam@v2
      - name: SAM build
        run: sam build
        working-directory: app-source
      - name: Package Lambda zip
        working-directory: app-source/.aws-sam/build/FulfillmentFunction
        run: zip -r "$GITHUB_WORKSPACE/lambda.zip" .

      - name: Upload zip to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" lambda.zip --clobber

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::222369475058:role/marketplace-fulfillment-artifact-publisher
          role-session-name: publish-marketplace-lambda
          aws-region: us-east-1

      - name: Upload versioned artifact to S3
        id: artifact
        run: bash scripts/publish-lambda-artifact.sh

      - name: Create infra-shared GitHub App token
        id: infra-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.INFRA_PR_APP_ID }}
          private-key: ${{ secrets.INFRA_PR_APP_PRIVATE_KEY }}
          owner: hyperflowfinance
          repositories: infra-shared
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout infra-shared
        uses: actions/checkout@v5
        with:
          repository: hyperflowfinance/infra-shared
          token: ${{ steps.infra-token.outputs.token }}
          path: infra-shared

      - name: Update stage artifact pin
        id: pin
        env:
          VERSION_ID: ${{ steps.artifact.outputs.version_id }}
          ARTIFACT_KEY: ${{ steps.artifact.outputs.key }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.sha256 }}
          TICKET_TEXT: ${{ env.TICKET_TEXT }}
        run: bash scripts/update-infra-artifact-pin.sh

      - name: Open stage deployment PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.infra-token.outputs.token }}
          path: infra-shared
          branch: deploy/marketplace-fulfillment-${{ env.RELEASE_TAG }}
          delete-branch: true
          title: "${{ steps.pin.outputs.ticket_key }}: Deploy Marketplace Fulfillment ${{ env.RELEASE_TAG }} to stage"
          body: "${{ steps.pin.outputs.ticket_key }}: Update the stage Lambda to the ZIP built from `${{ env.RELEASE_TAG }}`."
